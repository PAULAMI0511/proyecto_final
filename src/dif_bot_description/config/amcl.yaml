amcl:
  ros__parameters:
    use_sim_time: true

    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_footprint
    scan_topic: scan

    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    laser_model_type: "likelihood_field"
    laser_min_range: 0.12
    laser_max_range: 10.0
    max_beams: 60

    min_particles: 500
    max_particles: 2000

    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    update_min_d: 0.25
    update_min_a: 0.2
    transform_tolerance: 1.0
    tf_broadcast: true

map_server:
  ros__parameters:
    use_sim_time: true
    